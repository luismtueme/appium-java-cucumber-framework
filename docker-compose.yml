# Optional: Appium 2 server only (not used by CI).
#
# Preferred local/CI path: npm install -g appium && appium --address 127.0.0.1 --port 4723
#
# If you use this compose file instead:
#   docker compose up -d appium
# then still boot an emulator/simulator on the HOST and run Maven on the HOST:
#   APPIUM_SERVER_URL=http://127.0.0.1:4723 PLATFORM=android ./mvnw verify -DskipUnitTests=true
#
# This does not run the Java suite, Android emulator, or iOS Simulator.
services:
  appium:
    image: appium/appium:v2.19.0-p4
    container_name: appium-java-framework
    ports:
      - "4723:4723"
    volumes:
      - ./apps:/apps:ro
    environment:
      APPIUM_ALLOW_INSECURE: "chromedriver_autodownload"
    # Host Android emulator may be reachable via ADB over host gateway (setup can be fiddly).
    extra_hosts:
      - "host.docker.internal:host-gateway"
