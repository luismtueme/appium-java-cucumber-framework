# Non-secret defaults. Overridden by .env, environment variables, and -D system properties.
PLATFORM=android
TEST_ENV=local
APPIUM_SERVER_URL=http://127.0.0.1:4723
WAIT_TIMEOUT=15000
API_BASE_URL=https://jsonplaceholder.typicode.com
# Pinned Sauce Labs Mobile Sample App ("The App") — shared accessibility ids on Android and iOS
DEMO_ANDROID_APP=apps/Android.SauceLabs.Mobile.Sample.app.2.7.1.apk
DEMO_IOS_APP=apps/iOS.Simulator.SauceLabs.Mobile.Sample.app.2.7.1.app
DEMO_ANDROID_PACKAGE=com.swaglabsmobileapp
# Launcher activity from the APK manifest (MAIN/LAUNCHER). MainActivity is not launchable.
DEMO_ANDROID_ACTIVITY=com.swaglabsmobileapp.SplashActivity
# Wait for MainActivity only. Including SplashActivity here returns the session during splash,
# before React Native paints test-LOGIN (Appium activity-startup guide).
DEMO_ANDROID_WAIT_ACTIVITY=com.swaglabsmobileapp.MainActivity
DEMO_IOS_BUNDLE_ID=com.saucelabs.SwagLabsMobileApp
DEMO_USERNAME=standard_user
DEMO_PASSWORD=secret_sauce
