name: Appium Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Keep in step with <java.version> in pom.xml (ConsistencyTest checks)
  JAVA_VERSION: '21'
  DEMO_APP_VERSION: '2.7.1'

jobs:
  # Fast gate for every PR: formatting, compiler warnings-as-errors, framework unit tests with
  # coverage, architecture rules, Gherkin lint, version consistency, and a Cucumber dry run
  # (every step defined exactly once). No emulator, simulator or Appium server required.
  check:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Build, Unit Tests and Lint
        run: ./mvnw -B verify -DskipITs

      - name: Validate Step Definitions (dry run)
        run: ./mvnw -B verify -Pcheck

      - name: Upload Coverage Report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: unit-coverage
          path: target/site/jacoco/
          if-no-files-found: ignore
          retention-days: 14

  android:
    name: Android
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: true
      TEST_ENV: ci
      PLATFORM: android
      APPIUM_SERVER_URL: http://127.0.0.1:4723
      DEVICE_NAME: Android Emulator
      # Emulator + RN splash→login needs more than the local 15s default
      WAIT_TIMEOUT: '45000'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Appium and UiAutomator2
        run: |
          npm install -g appium
          appium driver install uiautomator2
          appium -v

      - name: Download demo apps
        run: bash scripts/download-apps.sh

      - name: Start Appium server
        run: |
          nohup appium --address 127.0.0.1 --port 4723 --log appium.log > /dev/null 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:4723/status >/dev/null; then
              echo "Appium is ready"
              exit 0
            fi
            sleep 2
          done
          echo "Appium failed to start"
          cat appium.log || true
          exit 1

      # aosp_atd avoids the common API 30 "System UI isn't responding" ANR on google_apis images.
      # Quarantine runs in the same emulator session to avoid a second cold boot.
      - name: Run Android suite (Cucumber + JUnit specs)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: aosp_atd
          arch: x86_64
          profile: pixel_4
          ram-size: 4096M
          heap-size: 512M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          # Kept POSIX /bin/sh-safe (android-emulator-runner wraps the script in sh -c).
          script: |
            i=0
            while [ "$i" -lt 60 ]; do
              if adb shell service check settings 2>/dev/null | grep -q "found"; then
                echo "settings service ready"
                break
              fi
              i=$((i + 1))
              sleep 2
            done
            ./mvnw -B verify -DskipUnitTests=true
            ./mvnw -B verify -Pquarantine || true

      - name: Upload Android artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: android-test-artifacts
          path: |
            target/cucumber-report.html
            target/cucumber-quarantine-report.html
            target/failsafe-reports/
            appium.log
          if-no-files-found: ignore
          retention-days: 14

  ios:
    name: iOS
    needs: check
    runs-on: macos-15
    timeout-minutes: 60
    env:
      CI: true
      TEST_ENV: ci
      PLATFORM: ios
      APPIUM_SERVER_URL: http://127.0.0.1:4723
      DEVICE_NAME: iPhone 16
      PLATFORM_VERSION: '18.5'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Appium and XCUITest
        run: |
          npm install -g appium
          appium driver install xcuitest
          appium -v

      - name: Download demo apps
        run: bash scripts/download-apps.sh

      - name: Prepare iOS simulator
        id: simulator
        uses: futureware-tech/simulator-action@v4
        with:
          model: ${{ env.DEVICE_NAME }}
          os_version: ${{ env.PLATFORM_VERSION }}
          wait_for_boot: true

      - name: Download prebuilt WebDriverAgent
        run: |
          mkdir -p wda
          if appium driver run xcuitest download-wda-sim --platform=ios --outdir=wda; then
            WDA="$(find wda -type d -name 'WebDriverAgentRunner-Runner.app' | head -n 1)"
            if [[ -n "$WDA" ]]; then
              echo "APPIUM_WDA_PATH=$WDA" >> "$GITHUB_ENV"
              echo "Using prebuilt WDA at $WDA"
            else
              echo "download-wda-sim finished but no Runner.app was found; Appium will build WDA"
              find wda -maxdepth 3 || true
            fi
          else
            echo "Prebuilt WDA download unavailable; Appium will build WDA via xcodebuild"
          fi

      - name: Start Appium server
        run: |
          nohup appium --address 127.0.0.1 --port 4723 --log appium.log > /dev/null 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:4723/status >/dev/null; then
              echo "Appium is ready"
              exit 0
            fi
            sleep 2
          done
          echo "Appium failed to start"
          cat appium.log || true
          exit 1

      - name: Run iOS suite (Cucumber + JUnit specs)
        run: ./mvnw -B verify -DskipUnitTests=true
        env:
          DEVICE_UDID: ${{ steps.simulator.outputs.udid }}

      - name: Upload iOS artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-artifacts
          path: |
            target/cucumber-report.html
            target/failsafe-reports/
            appium.log
          if-no-files-found: ignore
          retention-days: 14
